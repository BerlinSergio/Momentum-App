<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum Alarm</title><style>body{background:#151326;color:#fff;font-family:Segoe UI,sans-serif;text-align:center;margin:0;padding:25px}h1{font-size:24px;margin:10px 0}p{color:#c7c3da}button{font:inherit;padding:12px 20px;border:0;border-radius:9px;margin:6px;background:#6354d9;color:white;cursor:pointer}button:first-of-type{background:#38354c}button:focus-visible{outline:2px solid white}</style></head><body><h1 id="title">Momentum Alarm</h1><p id="hint">A scheduled reminder is ringing.</p><button id="snooze">Snooze 5 min</button><button id="stop">Stop</button><script>const lang=new URLSearchParams(location.search).get('lang');const c=lang==='ps-AF'?['د Momentum الارم','یوه ټاکل شوې یادونه غږېږي.','۵ دقیقې ځنډ','بندول']:lang==='fa-AF'?['زنگ Momentum','یک یادآوری در حال زنگ زدن است.','تعویق ۵ دقیقه','توقف']:null;if(c){document.documentElement.dir='rtl';document.documentElement.lang=lang;['title','hint','snooze','stop'].forEach((id,i)=>document.getElementById(id).textContent=c[i]);}let audio;let timer;function tone(){if(!audio)return;const t=audio.currentTime;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=i%2?740:520;g.gain.setValueAtTime(0,t+i*.24);g.gain.linearRampToValueAtTime(.16,t+i*.24+.03);g.gain.linearRampToValueAtTime(0,t+i*.24+.19);o.connect(g);g.connect(audio.destination);o.start(t+i*.24);o.stop(t+i*.24+.2);}}try{audio=new AudioContext();audio.resume().then(()=>{tone();timer=setInterval(tone,1700);}).catch(()=>{});}catch{}function act(action){clearInterval(timer);audio?.close().catch(()=>{});window.momentumDesktop.alarmAction(action);}document.getElementById('stop').onclick=()=>act('stop');document.getElementById('snooze').onclick=()=>act('snooze');</script></body></html>

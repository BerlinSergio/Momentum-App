name: Momentum Android Test Build

on:
  push:
    branches:
      - fix/db-phase217-migration-recovery-20261125
    paths:
      - '.github/workflows/momentum-android-test-build.yml'
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and synchronize Android assets
        run: |
          npm run build
          npx --no-install cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify package and record build provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          mkdir -p test-artifacts
          cp "$apk" test-artifacts/momentum-debug.apk
          git rev-parse HEAD > test-artifacts/commit.txt
          cd test-artifacts
          sha256sum momentum-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-android-debug-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 14

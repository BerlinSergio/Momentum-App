name: Momentum Android Test Build

on:
  push:
    branches:
      - fix/db-phase217-migration-recovery-20261125
      - fix/unified-reminder-alarm-system-20261127
    paths:
      - '.github/workflows/momentum-android-test-build.yml'
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Verify reminder timing rules
        run: node --test tests/notifications/reminderRules.test.mjs tests/notifications/ringingAlarmPlan.test.mjs
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and synchronize Android assets
        run: |
          npm run build
          npx --no-install cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Android unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Verify package and record build provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          mkdir -p test-artifacts
          cp "$apk" test-artifacts/momentum-debug.apk
          git rev-parse HEAD > test-artifacts/commit.txt
          cd test-artifacts
          sha256sum momentum-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-android-debug-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Build instrumented alarm tests
        working-directory: android
        run: bash ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Android emulator delivery, stop, snooze and cancellation
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-34;google_apis;x86_64"
          echo no | avdmanager create avd --force -n momentum_ci -k "system-images;android-34;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd momentum_ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT
          timeout 180 adb wait-for-device
          for i in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm grant com.momentum.app android.permission.POST_NOTIFICATIONS
          adb shell appops set com.momentum.app SCHEDULE_EXACT_ALARM allow
          adb shell am instrument -w -r -e class com.momentum.app.MomentumAlarmInstrumentedTest com.momentum.app.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/alarm-instrumentation.txt"
          grep -Eq '^OK \(3 tests\)' "$RUNNER_TEMP/alarm-instrumentation.txt"

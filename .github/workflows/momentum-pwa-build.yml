name: Momentum PWA candidate
on:
  push:
    branches: [feat/pwa-v1.0.2]
    paths: ['scripts/prepare-pwa.mjs','.github/workflows/momentum-pwa-build.yml','src/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momentum-pwa-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build production PWA
        run: |
          set -euo pipefail
          npm ci --no-fund
          node --test tests/notifications/reminderRules.test.mjs tests/notifications/ringingAlarmPlan.test.mjs tests/notifications/perReminderDelivery.test.mjs
          npm run build -- --base=/Momentum-App/
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          source=Path('public/logo.png')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='3c5882560d81298cc24418cacc4e4ccee836bdd8500e6c9c5886e3956b9aa6e8'
          im=Image.open(source).convert('RGB').crop((60,60,1186,1186))
          for n,size in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180)]:
              im.resize((size,size),Image.Resampling.LANCZOS).save('dist/'+n)
          PY
          node scripts/prepare-pwa.mjs
      - name: Verify offline reload and install manifest in Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwa-site"
          cp -R dist "$RUNNER_TEMP/pwa-site/Momentum-App"
          python -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pwa-site" > "$RUNNER_TEMP/pwa-server.log" 2>&1 &
          trap 'kill $! || true' EXIT
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox','--disable-setuid-sandbox']});
          try{
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
            await page.goto('http://127.0.0.1:4173/Momentum-App/',{waitUntil:'load',timeout:90000});
            await page.waitForSelector('[data-app-startup-ready=true]',{timeout:90000});
            await page.waitForFunction(()=>navigator.serviceWorker.controller!==null,{timeout:90000});
            const online=await page.evaluate(async()=>{const m=await fetch('manifest.json').then(r=>r.json());return {scope:m.scope,icons:m.icons.length,secure:isSecureContext,db:!!indexedDB,crypto:!!crypto.subtle};});
            assert.deepEqual(online,{scope:'/Momentum-App/',icons:2,secure:true,db:true,crypto:true});
            await page.setOfflineMode(true);
            await page.reload({waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('[data-app-startup-ready=true]',{timeout:90000});
            console.log('Offline reload, local database and secure context passed');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-pwa-candidate-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Prepare first Pages publishing branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then echo 'gh-pages exists; refusing to overwrite'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp -a dist/. "$tmp/"
          git -C "$tmp" init -b gh-pages
          git -C "$tmp" config user.name 'github-actions[bot]'
          git -C "$tmp" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$tmp" add .
          git -C "$tmp" commit -m "Publish tested Momentum PWA 1.0.2"
          git -C "$tmp" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH="$(git config --local --get http.https://github.com/.extraheader)"
          git -C "$tmp" -c "http.https://github.com/.extraheader=$AUTH" push origin gh-pages

name: Momentum launcher icon patch
on:
  push:
    branches: [fix/android-launcher-icon-v1.0.1]
    paths: ['.github/workflows/momentum-launcher-icon-patch.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: momentum-launcher-icon-patch
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/fix/android-launcher-icon-v1.0.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate native launcher resources from approved exact logo
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import hashlib
          source = Path("public/logo.png")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "3c5882560d81298cc24418cacc4e4ccee836bdd8500e6c9c5886e3956b9aa6e8"
          original = Image.open(source).convert("RGB")
          assert original.size == (1254, 1254)
          crop = original.crop((60,60,1186,1186))
          res = Path("android/app/src/main/res")
          # Adaptive icon: keep the original mark inside the safe area.
          # Extend the existing edge pixels to fill the overscan region.
          inner = crop.resize((336,336), Image.Resampling.LANCZOS)
          adaptive = Image.new("RGB",(432,432))
          adaptive.paste(inner,(48,48))
          adaptive.paste(inner.crop((0,0,1,336)).resize((48,336)),(0,48))
          adaptive.paste(inner.crop((335,0,336,336)).resize((48,336)),(384,48))
          adaptive.paste(adaptive.crop((0,48,432,49)).resize((432,48)),(0,0))
          adaptive.paste(adaptive.crop((0,383,432,384)).resize((432,48)),(0,384))
          for density, legacy, layer in [("mdpi",48,108),("hdpi",72,162),("xhdpi",96,216),("xxhdpi",144,324),("xxxhdpi",192,432)]:
              folder = res / ("mipmap-" + density)
              # Legacy icon: preserve the rounded square artwork, with transparent outside corners.
              mask = Image.new("L",crop.size)
              ImageDraw.Draw(mask).rounded_rectangle((0,0,1125,1125),radius=290,fill=255)
              square = crop.convert("RGBA")
              square.putalpha(mask)
              square.resize((legacy,legacy),Image.Resampling.LANCZOS).save(folder/"ic_launcher.png",optimize=True)
              round_mask = Image.new("L",crop.size)
              ImageDraw.Draw(round_mask).ellipse((0,0,1125,1125),fill=255)
              circle = crop.convert("RGBA")
              circle.putalpha(round_mask)
              circle.resize((legacy,legacy),Image.Resampling.LANCZOS).save(folder/"ic_launcher_round.png",optimize=True)
              adaptive.resize((layer,layer),Image.Resampling.LANCZOS).save(folder/"ic_launcher_foreground.png",optimize=True)
              for name, size in [("ic_launcher",legacy),("ic_launcher_round",legacy),("ic_launcher_foreground",layer)]:
                  assert Image.open(folder/(name+".png")).size == (size,size)
          background = res/"values/ic_launcher_background.xml"
          background.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B0819</color>\n</resources>\n')
          for name in ["ic_launcher.xml","ic_launcher_round.xml"]:
              xml = (res/"mipmap-anydpi-v26"/name).read_text()
              assert '@mipmap/ic_launcher_foreground' in xml and '@color/ic_launcher_background' in xml
          gradle = Path("android/app/build.gradle")
          old = gradle.read_text()
          if 'versionCode 1\n' in old and 'versionName "1.0"\n' in old:
              gradle.write_text(old.replace('versionCode 1\n','versionCode 2\n',1).replace('versionName "1.0"\n','versionName "1.0.1"\n',1))
          else:
              assert 'versionCode 2\n' in old and 'versionName "1.0.1"\n' in old
          print("Verified exact original logo, all 15 launcher bitmaps and update version.")
          PY
      - name: Commit only icon resources and update version to isolated branch
        id: commit
        run: |
          set -euo pipefail
          git add android/app/src/main/res/mipmap-*/ic_launcher*.png android/app/src/main/res/values/ic_launcher_background.xml android/app/build.gradle
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(android): use approved Momentum logo for launcher icon and bump patch version"
            git push origin HEAD:refs/heads/fix/android-launcher-icon-v1.0.1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: generate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.commit }}
          persist-credentials: false
      - name: Ensure application logic and original release remain unchanged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = adf5b2d2af9fbefc93b4a009210c694afe452266
          test "$(git hash-object public/logo.png)" = fdfa5abcb2eff6514b207ef079ee9237e8006180
          test "$(git rev-parse HEAD)" = "${{ needs.generate.outputs.commit }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-fund
      - run: node --test tests/notifications/reminderRules.test.mjs tests/notifications/ringingAlarmPlan.test.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build icon patch
        run: |
          set -euo pipefail
          npm run build
          npx --no-install cap sync android
          (cd android && bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace)
      - name: Verify packaged launcher resources and update metadata
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > badging.txt
          grep -F "name='com.momentum.app'" badging.txt | grep -F "versionCode='2'" | grep -F "versionName='1.0.1'"
          grep -F "launchable-activity:" badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$apk" > resources.txt
          grep -F 'mipmap/ic_launcher' resources.txt
          grep -F 'mipmap/ic_launcher_round' resources.txt
          grep -F 'mipmap/ic_launcher_foreground' resources.txt
          unzip -tq "$apk"
          mkdir -p test-artifacts
          cp "$apk" test-artifacts/Momentum-1.0.1-debug.apk
          cp badging.txt test-artifacts/
          git rev-parse HEAD > test-artifacts/commit.txt
          (cd test-artifacts && sha256sum Momentum-1.0.1-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-icon-patch-debug
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 14

name: Momentum unsigned IPA candidate
on:
  push:
    branches: [feat/ios-ipa-v1.0.2]
    paths: ['ios/**','src/**','.github/workflows/momentum-ios-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: momentum-ios-ipa-candidate
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reminder rules and build shared application
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          npm ci --no-fund
          node --test tests/notifications/reminderRules.test.mjs tests/notifications/ringingAlarmPlan.test.mjs tests/notifications/perReminderDelivery.test.mjs
          npm run build
          npx cap sync ios
      - name: Generate iPhone icon from approved original
        run: |
          set -euo pipefail
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          source=Path('public/logo.png')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='3c5882560d81298cc24418cacc4e4ccee836bdd8500e6c9c5886e3956b9aa6e8'
          Image.open(source).convert('RGB').crop((60,60,1186,1186)).resize((1024,1024),Image.Resampling.LANCZOS).save('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png')
          PY
          plutil -lint ios/App/App/Info.plist
      - name: Build unsigned physical-device application
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/device-build.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/device-build.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/device-build.log"
      - name: Package unsigned IPA for personal signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = com.momentum.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = 1.0.2
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = 3
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ios-artifacts
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Momentum.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/ios-artifacts/Momentum-1.0.2-unsigned.ipa" Payload)
          unzip -tq ios-artifacts/Momentum-1.0.2-unsigned.ipa
          unzip -l ios-artifacts/Momentum-1.0.2-unsigned.ipa | grep 'Payload/Momentum.app/Info.plist'
          git rev-parse HEAD > ios-artifacts/commit.txt
          (cd ios-artifacts && shasum -a 256 Momentum-1.0.2-unsigned.ipa > SHA256SUMS.txt)
          printf '%s\n' 'Unsigned iOS device build. Requires personal signing before installation. Not App Store or TestFlight signed. Device compatibility and AlarmKit authorization require testing.' > ios-artifacts/INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-unsigned-ipa-${{ github.sha }}
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 30
